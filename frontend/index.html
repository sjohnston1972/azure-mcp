<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>azure-mcp</title>

    <!--
      Same fonts/icons as netbud so the two tools feel like siblings.
      Loaded from Google's CDN; no bundle weight.

      `crossorigin="anonymous"` on the stylesheet links is REQUIRED for
      the GitHub-sync canvas screenshot to render icon glyphs instead
      of ligature TEXT (e.g. "lan", "shield", "memory"). Without it the
      browser loads the stylesheet in "no-cors" mode and refuses to
      expose its cssRules to JS, so html-to-image's getFontEmbedCSS()
      can't find the @font-face rules and the foreignObject pipeline
      falls back to the system font. Google Fonts serves these
      stylesheets with the right Access-Control-Allow-Origin header so
      this is safe.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
