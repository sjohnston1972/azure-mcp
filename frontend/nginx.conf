server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS server. Without this, nginx resolves the
  # backend container name ONCE at startup and caches that IP forever —
  # so if the backend container restarts and gets a new IP, every /api/
  # call 502s until the frontend is also restarted. With a resolver and
  # a variable in proxy_pass (below), nginx re-resolves the name on
  # each request instead.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Gzip basics — keep the tunnel transfer small.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # SPA: serve index.html for any path that isn't a real file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api/* → backend by container name on net_core.
  # proxy_pass via a variable so nginx uses the resolver above on every
  # request rather than the IP it cached at startup.
  location /api/ {
    set $backend_upstream http://azure-mcp-backend:3000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Forward Cloudflare Access identity headers untouched so the
    # backend can trust them.
    proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;

    # Streaming chat (SSE / chunked) — disable response buffering.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # /health → backend health endpoint, used by docker healthcheck if
  # the frontend ever wants to probe upstream.
  location = /health {
    set $backend_upstream http://azure-mcp-backend:3000;
    proxy_pass $backend_upstream/health;
  }
}
